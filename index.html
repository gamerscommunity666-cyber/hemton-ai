<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HEMTON.AI</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#0b0d10;
  --panel:#111419;
  --panel2:#171a20;
  --border:#292e37;
  --text:#f2f3f5;
  --muted:#9298a3;
  --accent:#10a37f;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  overflow:hidden;
}

.app{
  height:100vh;
  display:flex;
}

/* SIDEBAR */

.sidebar{
  width:270px;
  background:#080a0d;
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  padding:14px;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  padding:12px 8px 22px;
  font-size:21px;
  font-weight:bold;
}

.logo{
  width:34px;
  height:34px;
  border-radius:11px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#19c99b,#08785f);
  color:white;
  font-weight:900;
  box-shadow:0 0 22px #10a37f55;
}

.newchat{
  width:100%;
  padding:12px;
  border:1px solid var(--border);
  background:var(--panel);
  color:white;
  border-radius:9px;
  text-align:left;
  font-size:14px;
  cursor:pointer;
}

.newchat:hover{
  background:var(--panel2);
}

.history{
  flex:1;
  overflow:auto;
  margin-top:18px;
}

.history-title{
  color:#777e89;
  font-size:12px;
  padding:8px;
  text-transform:uppercase;
}

.chat-item{
  padding:11px;
  border-radius:8px;
  color:#c8ccd2;
  font-size:14px;
  margin:3px 0;
}

.chat-item.active{
  background:#191d23;
  color:white;
}

.account{
  border-top:1px solid var(--border);
  padding-top:14px;
  color:#c8ccd2;
  font-size:14px;
}

/* MAIN */

.main{
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0;
}

.topbar{
  height:62px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 22px;
  background:#0c0e12;
}

.model{
  background:transparent;
  border:0;
  color:white;
  font-size:16px;
  font-weight:bold;
}

.menu{
  color:#aaa;
  font-size:21px;
}

.messages{
  flex:1;
  overflow:auto;
  padding:30px 18px 160px;
}

.welcome{
  max-width:760px;
  margin:12vh auto 0;
  text-align:center;
}

.welcome-logo{
  width:70px;
  height:70px;
  margin:auto;
  border-radius:23px;
  display:grid;
  place-items:center;
  font-size:30px;
  font-weight:bold;
  background:linear-gradient(135deg,#13c99b,#075d4c);
  box-shadow:0 0 45px #10a37f44;
  animation:pulse 3s infinite;
}

@keyframes pulse{
  0%,100%{box-shadow:0 0 30px #10a37f33}
  50%{box-shadow:0 0 60px #10a37f77}
}

.welcome h1{
  font-size:34px;
  margin:25px 0 10px;
}

.welcome p{
  color:var(--muted);
  font-size:16px;
}

.suggestions{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:35px;
}

.suggestion{
  border:1px solid var(--border);
  background:var(--panel);
  border-radius:12px;
  padding:16px;
  text-align:left;
  color:#d6d9de;
  cursor:pointer;
}

.suggestion:hover{
  background:var(--panel2);
}

/* MESSAGES */

.message{
  max-width:800px;
  margin:0 auto;
  display:flex;
  gap:14px;
  padding:22px 0;
}

.avatar{
  width:32px;
  height:32px;
  min-width:32px;
  border-radius:9px;
  display:grid;
  place-items:center;
  font-size:13px;
  font-weight:bold;
}

.user .avatar{
  background:#3a3f48;
}

.ai .avatar{
  background:linear-gradient(135deg,#16bd92,#08765d);
}

.content{
  line-height:1.65;
  font-size:15px;
  white-space:pre-wrap;
}

/* INPUT */

.input-area{
  position:fixed;
  bottom:0;
  left:270px;
  right:0;
  padding:18px 18px 25px;
  background:linear-gradient(transparent,#0b0d10 30%);
}

.composer{
  max-width:800px;
  margin:auto;
  background:#171a20;
  border:1px solid #343943;
  border-radius:17px;
  display:flex;
  align-items:flex-end;
  padding:10px;
  box-shadow:0 8px 35px #00000066;
}

textarea{
  flex:1;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  padding:10px;
  font-size:15px;
  max-height:130px;
  min-height:42px;
}

textarea::placeholder{
  color:#777e89;
}

.tool{
  width:40px;
  height:40px;
  border:0;
  background:transparent;
  color:#aeb4bd;
  border-radius:9px;
  font-size:19px;
  cursor:pointer;
}

.tool:hover{
  background:#242830;
}

.send{
  background:white;
  color:#101216;
  font-weight:bold;
}

.send:hover{
  background:#ddd;
}

.disclaimer{
  text-align:center;
  color:#666c75;
  font-size:11px;
  margin-top:8px;
}

/* MOBILE */

.mobile-menu{
  display:none;
}

@media(max-width:750px){

  .sidebar{
    display:none;
  }

  .mobile-menu{
    display:block;
    background:transparent;
    border:0;
    color:white;
    font-size:22px;
    margin-right:12px;
  }

  .topbar{
    padding:0 14px;
  }

  .input-area{
    left:0;
    padding:10px 10px 17px;
  }

  .messages{
    padding-left:14px;
    padding-right:14px;
  }

  .welcome{
    margin-top:10vh;
  }

  .welcome h1{
    font-size:28px;
  }

  .suggestions{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar">

  <div class="brand">
    <div class="logo">H</div>
    HEMTON.AI
  </div>

  <button class="newchat" onclick="newChat()">
    ＋ New chat
  </button>

  <div class="history">
    <div class="history-title">Today</div>

    <div class="chat-item active">
      New conversation
    </div>

    <div class="chat-item">
      Website ideas
    </div>

    <div class="chat-item">
      Coding assistant
    </div>
  </div>

  <div class="account">
    ⚙ Settings<br><br>
    HEMTON.AI
  </div>

</aside>

<main class="main">

  <header class="topbar">

    <div>
      <button class="mobile-menu" onclick="toggleSidebar()">☰</button>
      <select class="model" id="model">
        <option>HEMTON AI</option>
        <option>HEMTON AI Pro</option>
        <option>HEMTON Creative</option>
      </select>
    </div>

    <div class="menu">⋯</div>

  </header>

  <section class="messages" id="messages">

    <div class="welcome" id="welcome">

      <div class="welcome-logo">H</div>

      <h1>How can I help you?</h1>

      <p>
        Welcome to HEMTON.AI — your intelligent AI workspace.
      </p>

      <div class="suggestions">

        <div class="suggestion"
             onclick="usePrompt('Explain something to me in a simple way')">
          💡 Explain something
        </div>

        <div class="suggestion"
             onclick="usePrompt('Help me write some code')">
          💻 Help me code
        </div>

        <div class="suggestion"
             onclick="usePrompt('Give me a creative idea for my project')">
          ✨ Be creative
        </div>

        <div class="suggestion"
             onclick="usePrompt('Help me plan my project')">
          🚀 Plan a project
        </div>

      </div>

    </div>

  </section>

</main>

<div class="input-area">

  <div class="composer">

    <button class="tool" title="Attach">＋</button>

    <textarea
      id="input"
      placeholder="Message HEMTON.AI..."
      rows="1"
      onkeydown="handleKey(event)"
    ></textarea>

    <button class="tool" title="Voice" onclick="voiceInput()">
      🎙
    </button>

    <button class="tool send" onclick="sendMessage()">
      ↑
    </button>

  </div>

  <div class="disclaimer">
    HEMTON.AI can make mistakes. Check important information.
  </div>

</div>

</div>

<script>

const input = document.getElementById("input");
const messages = document.getElementById("messages");
const welcome = document.getElementById("welcome");

function usePrompt(text){
  input.value = text;
  input.focus();
}

function handleKey(e){
  if(e.key === "Enter" && !e.shiftKey){
    e.preventDefault();
    sendMessage();
  }
}

function sendMessage(){

  const text = input.value.trim();

  if(!text) return;

  welcome.style.display="none";

  addMessage(text,"user");

  input.value="";

  setTimeout(()=>{
    const reply =
      "Hello! I'm HEMTON.AI. 👋\n\n" +
      "I received your message:\n\"" +
      text +
      "\"\n\n" +
      "I'm currently running in demo mode. " +
      "Connect an AI API to give me real AI intelligence.";

    addMessage(reply,"ai");
  },700);
}

function addMessage(text,type){

  const message=document.createElement("div");
  message.className="message "+type;

  const avatar=document.createElement("div");
  avatar.className="avatar";
  avatar.textContent=type==="ai"?"H":"You";

  const content=document.createElement("div");
  content.className="content";
  content.textContent=text;

  message.appendChild(avatar);
  message.appendChild(content);

  messages.appendChild(message);

  messages.scrollTop=messages.scrollHeight;
}

function newChat(){

  messages.innerHTML="";
  messages.appendChild(welcome);
  welcome.style.display="block";
}

function voiceInput(){

  if(!("webkitSpeechRecognition" in window)){
    alert("Voice input is not supported in this browser.");
    return;
  }

  const recognition =
    new webkitSpeechRecognition();

  recognition.lang="en-US";
  recognition.start();

  recognition.onresult=function(event){
    input.value=event.results[0][0].transcript;
  };
}

function toggleSidebar(){
  alert("Open HEMTON.AI on a larger screen to see the full sidebar.");
}

</script>

</body>
</html>
