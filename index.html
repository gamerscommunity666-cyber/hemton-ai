<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0b0d10">
<meta name="description" content="HEMTON.AI - Your intelligent AI assistant">
<title>HEMTON.AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#0b0d10;
  --sidebar:#080a0d;
  --panel:#111419;
  --panel2:#171a20;
  --hover:#20242b;
  --border:#292e37;
  --text:#f4f5f7;
  --muted:#9ba1ab;
  --green:#10a37f;
  --green2:#08775e;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}

button,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

/* APP */

.app{
  width:100%;
  height:100vh;
  display:flex;
}

/* SIDEBAR */

.sidebar{
  width:270px;
  height:100vh;
  background:var(--sidebar);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  padding:14px;
  transition:transform .25s ease;
  z-index:20;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
  padding:8px 6px 20px;
  font-size:20px;
  font-weight:750;
  letter-spacing:-.4px;
}

.logo{
  width:36px;
  height:36px;
  border-radius:11px;
  display:grid;
  place-items:center;
  background:linear-gradient(145deg,#19d3a1,#075b49);
  box-shadow:0 0 28px rgba(16,163,127,.28);
  color:white;
  font-weight:900;
}

.new-chat{
  width:100%;
  border:1px solid var(--border);
  background:var(--panel);
  color:var(--text);
  border-radius:10px;
  padding:12px 13px;
  text-align:left;
  transition:.18s;
}

.new-chat:hover{
  background:var(--hover);
}

.new-chat span{
  margin-right:7px;
  font-size:17px;
}

.history{
  flex:1;
  overflow:auto;
  margin-top:18px;
}

.history-title{
  padding:8px;
  color:#707782;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.8px;
}

.history-item{
  padding:10px 11px;
  margin:3px 0;
  border-radius:8px;
  color:#c7cbd1;
  font-size:14px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.history-item:hover,
.history-item.active{
  background:var(--panel2);
  color:white;
}

.sidebar-bottom{
  border-top:1px solid var(--border);
  padding-top:13px;
}

.account{
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px;
  border-radius:9px;
}

.account:hover{
  background:var(--panel);
}

.account-avatar{
  width:31px;
  height:31px;
  border-radius:8px;
  display:grid;
  place-items:center;
  background:#303640;
  font-size:12px;
}

.account-text{
  min-width:0;
}

.account-name{
  font-size:13px;
  font-weight:650;
}

.account-sub{
  color:#777e88;
  font-size:11px;
}

/* MAIN */

.main{
  flex:1;
  min-width:0;
  height:100vh;
  display:flex;
  flex-direction:column;
  position:relative;
}

/* TOP BAR */

.topbar{
  height:62px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  border-bottom:1px solid var(--border);
  background:rgba(11,13,16,.92);
  backdrop-filter:blur(12px);
  z-index:5;
}

.top-left{
  display:flex;
  align-items:center;
}

.mobile-menu{
  display:none;
  border:0;
  background:transparent;
  color:white;
  font-size:22px;
  margin-right:12px;
}

.model-select{
  appearance:none;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  font-size:15px;
  font-weight:700;
  padding:7px 27px 7px 7px;
  cursor:pointer;
}

.model-wrap{
  position:relative;
}

.model-wrap::after{
  content:"⌄";
  position:absolute;
  right:5px;
  top:4px;
  color:#858b94;
  pointer-events:none;
}

.top-right{
  display:flex;
  gap:5px;
}

.top-button{
  width:38px;
  height:38px;
  border:0;
  border-radius:9px;
  background:transparent;
  color:#aab0b8;
  font-size:19px;
}

.top-button:hover{
  background:var(--hover);
  color:white;
}

/* CHAT */

.chat{
  flex:1;
  overflow-y:auto;
  padding:20px 18px 165px;
  scroll-behavior:smooth;
}

.chat-inner{
  width:100%;
  max-width:850px;
  margin:0 auto;
}

/* WELCOME */

.welcome{
  min-height:calc(100vh - 250px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px 0;
}

.welcome-inner{
  width:100%;
  text-align:center;
}

.big-logo{
  width:76px;
  height:76px;
  margin:0 auto 23px;
  border-radius:25px;
  display:grid;
  place-items:center;
  font-size:31px;
  font-weight:900;
  background:linear-gradient(145deg,#19d3a1,#075b49);
  box-shadow:
    0 0 35px rgba(16,163,127,.25),
    inset 0 1px rgba(255,255,255,.12);
  animation:logoPulse 3s ease-in-out infinite;
}

@keyframes logoPulse{
  0%,100%{
    transform:translateY(0);
    box-shadow:0 0 35px rgba(16,163,127,.22);
  }
  50%{
    transform:translateY(-4px);
    box-shadow:0 0 58px rgba(16,163,127,.38);
  }
}

.welcome h1{
  font-size:34px;
  letter-spacing:-1px;
  margin-bottom:9px;
}

.welcome p{
  color:var(--muted);
  font-size:15px;
}

.suggestions{
  max-width:650px;
  margin:34px auto 0;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.suggestion{
  border:1px solid var(--border);
  background:var(--panel);
  border-radius:12px;
  padding:15px;
  text-align:left;
  color:#d4d7dc;
  transition:.18s;
}

.suggestion:hover{
  background:var(--hover);
  border-color:#3a414c;
  transform:translateY(-1px);
}

.suggestion-title{
  font-size:14px;
  font-weight:650;
  margin-bottom:4px;
}

.suggestion-text{
  color:#858c96;
  font-size:12px;
}

/* MESSAGE */

.message{
  display:flex;
  gap:15px;
  padding:24px 0;
  border-bottom:1px solid rgba(255,255,255,.025);
}

.message-avatar{
  width:32px;
  height:32px;
  min-width:32px;
  border-radius:9px;
  display:grid;
  place-items:center;
  font-size:11px;
  font-weight:800;
}

.message.user .message-avatar{
  background:#3b414b;
}

.message.ai .message-avatar{
  background:linear-gradient(145deg,#19c99b,#08775e);
  box-shadow:0 0 18px rgba(16,163,127,.14);
}

.message-body{
  min-width:0;
  flex:1;
}

.message-name{
  font-size:12px;
  color:#858b94;
  margin-bottom:6px;
}

.message-content{
  color:#e9eaed;
  font-size:15px;
  line-height:1.7;
  white-space:pre-wrap;
  word-break:break-word;
}

.message-actions{
  margin-top:9px;
  display:flex;
  gap:4px;
  opacity:.65;
}

.action-button{
  border:0;
  background:transparent;
  color:#8d949e;
  padding:5px 7px;
  border-radius:6px;
  font-size:12px;
}

.action-button:hover{
  background:var(--hover);
  color:white;
}

/* TYPING */

.typing{
  display:flex;
  align-items:center;
  gap:5px;
  height:22px;
}

.dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#9aa1aa;
  animation:bounce 1.2s infinite;
}

.dot:nth-child(2){
  animation-delay:.15s;
}

.dot:nth-child(3){
  animation-delay:.3s;
}

@keyframes bounce{
  0%,60%,100%{
    transform:translateY(0);
    opacity:.4;
  }
  30%{
    transform:translateY(-5px);
    opacity:1;
  }
}

/* COMPOSER */

.composer-area{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:18px 18px 24px;
  background:
    linear-gradient(
      to bottom,
      transparent 0%,
      rgba(11,13,16,.85) 27%,
      var(--bg) 55%
    );
  z-index:10;
}

.composer{
  width:100%;
  max-width:850px;
  margin:0 auto;
  background:#171a20;
  border:1px solid #353b45;
  border-radius:17px;
  display:flex;
  align-items:flex-end;
  padding:8px;
  box-shadow:0 12px 40px rgba(0,0,0,.35);
  transition:border .2s, box-shadow .2s;
}

.composer:focus-within{
  border-color:#4b535e;
  box-shadow:0 12px 45px rgba(0,0,0,.45);
}

textarea{
  flex:1;
  min-height:42px;
  max-height:140px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  padding:10px 9px;
  line-height:1.45;
  font-size:15px;
}

textarea::placeholder{
  color:#777e88;
}

.composer-button{
  width:40px;
  height:40px;
  flex:none;
  border:0;
  border-radius:9px;
  background:transparent;
  color:#a9afb8;
  font-size:18px;
  display:grid;
  place-items:center;
}

.composer-button:hover{
  background:#252a31;
  color:white;
}

.send-button{
  background:#f3f4f5;
  color:#0b0d10;
  font-weight:900;
}

.send-button:hover{
  background:white;
  color:#000;
}

.send-button:disabled{
  opacity:.35;
  cursor:not-allowed;
}

.disclaimer{
  text-align:center;
  margin-top:8px;
  color:#626873;
  font-size:10px;
}

/* MOBILE OVERLAY */

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:15;
}

/* SCROLLBAR */

::-webkit-scrollbar{
  width:8px;
}

::-webkit-scrollbar-track{
  background:transparent;
}

::-webkit-scrollbar-thumb{
  background:#30353d;
  border-radius:10px;
}

/* MOBILE */

@media(max-width:760px){

  .sidebar{
    position:fixed;
    left:0;
    top:0;
    transform:translateX(-100%);
    box-shadow:15px 0 45px rgba(0,0,0,.4);
  }

  .sidebar.open{
    transform:translateX(0);
  }

  .overlay.open{
    display:block;
  }

  .mobile-menu{
    display:block;
  }

  .topbar{
    padding:0 12px;
  }

  .chat{
    padding:15px 13px 160px;
  }

  .composer-area{
    padding:10px 10px 16px;
  }

  .suggestions{
    grid-template-columns:1fr;
  }

  .welcome h1{
    font-size:28px;
  }

  .welcome p{
    font-size:14px;
  }

  .message{
    gap:10px;
    padding:19px 0;
  }

  .message-content{
    font-size:14px;
  }
}

@media(max-width:400px){

  .big-logo{
    width:65px;
    height:65px;
    border-radius:21px;
  }

  .welcome h1{
    font-size:25px;
  }

  .model-select{
    font-size:14px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->

  <aside class="sidebar" id="sidebar">

    <div class="brand">
      <div class="logo">H</div>
      <span>HEMTON.AI</span>
    </div>

    <button class="new-chat" onclick="newChat()">
      <span>＋</span> New chat
    </button>

    <div class="history">

      <div class="history-title">Recent</div>

      <div id="historyList">
        <div class="history-item active">
          New conversation
        </div>
      </div>

    </div>

    <div class="sidebar-bottom">

      <div class="account">

        <div class="account-avatar">
          GC
        </div>

        <div class="account-text">
          <div class="account-name">
            HEMTON User
          </div>
          <div class="account-sub">
            HEMTON.AI
          </div>
        </div>

      </div>

    </div>

  </aside>

  <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

  <!-- MAIN -->

  <main class="main">

    <header class="topbar">

      <div class="top-left">

        <button
          class="mobile-menu"
          onclick="toggleSidebar()">
          ☰
        </button>

        <div class="model-wrap">

          <select class="model-select" id="modelSelect">
            <option>HEMTON AI</option>
            <option>HEMTON AI Pro</option>
            <option>HEMTON Creative</option>
          </select>

        </div>

      </div>

      <div class="top-right">

        <button
          class="top-button"
          title="New chat"
          onclick="newChat()">
          ＋
        </button>

      </div>

    </header>

    <!-- CHAT -->

    <section class="chat" id="chat">

      <div class="chat-inner" id="chatInner">

        <!-- WELCOME -->

        <div class="welcome" id="welcome">

          <div class="welcome-inner">

            <div class="big-logo">
              H
            </div>

            <h1>
              How can I help you?
            </h1>

            <p>
              Your intelligent assistant, powered by HEMTON.AI
            </p>

            <div class="suggestions">

              <button
                class="suggestion"
                onclick="useSuggestion('Explain something to me in a simple way')">

                <div class="suggestion-title">
                  💡 Explain something
                </div>

                <div class="suggestion-text">
                  Learn a difficult topic simply
                </div>

              </button>

              <button
                class="suggestion"
                onclick="useSuggestion('Help me write some code')">

                <div class="suggestion-title">
                  💻 Help me code
                </div>

                <div class="suggestion-text">
                  Build or fix a programming project
                </div>

              </button>

              <button
                class="suggestion"
                onclick="useSuggestion('Give me a creative idea for my project')">

                <div class="suggestion-title">
                  ✨ Be creative
                </div>

                <div class="suggestion-text">
                  Generate fresh ideas
                </div>

              </button>

              <button
                class="suggestion"
                onclick="useSuggestion('Help me plan my project')">

                <div class="suggestion-title">
                  🚀 Plan something
                </div>

                <div class="suggestion-text">
                  Turn an idea into a plan
                </div>

              </button>

            </div>

          </div>

        </div>

      </div>

    </section>

    <!-- COMPOSER -->

    <div class="composer-area">

      <div class="composer">

        <textarea
          id="input"
          rows="1"
          placeholder="Message HEMTON.AI..."
          autocomplete="off"
          spellcheck="true"></textarea>

        <button
          class="composer-button"
          title="Voice input"
          onclick="startVoice()">
          🎙
        </button>

        <button
          class="composer-button send-button"
          id="sendButton"
          title="Send"
          onclick="sendMessage()">
          ↑
        </button>

      </div>

      <div class="disclaimer">
        HEMTON.AI can make mistakes. Check important information.
      </div>

    </div>

  </main>

</div>

<script>

const input = document.getElementById("input");
const sendButton = document.getElementById("sendButton");
const chatInner = document.getElementById("chatInner");
const welcome = document.getElementById("welcome");
const chat = document.getElementById("chat");
const historyList = document.getElementById("historyList");
const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");

let conversationStarted = false;

/* AUTO RESIZE */

input.addEventListener("input", function(){

  this.style.height = "auto";

  this.style.height =
    Math.min(this.scrollHeight,140) + "px";

  sendButton.disabled =
    !this.value.trim();

});

sendButton.disabled = true;

/* ENTER TO SEND */

input.addEventListener("keydown",function(event){

  if(
    event.key === "Enter" &&
    !event.shiftKey
  ){

    event.preventDefault();

    sendMessage();

  }

});

/* SUGGESTIONS */

function useSuggestion(text){

  input.value = text;

  input.dispatchEvent(
    new Event("input")
  );

  input.focus();

}

/* SEND */

function sendMessage(){

  const text = input.value.trim();

  if(!text) return;

  if(!conversationStarted){

    welcome.style.display="none";

    conversationStarted=true;

    addHistoryItem(text);

  }

  addMessage(text,"user");

  input.value="";

  input.style.height="auto";

  sendButton.disabled=true;

  showTyping();

  setTimeout(function(){

    removeTyping();

    addMessage(
      generateDemoReply(text),
      "ai"
    );

  },900);

}

/* ADD MESSAGE */

function addMessage(text,type){

  const message =
    document.createElement("div");

  message.className =
    "message " + type;

  const avatar =
    document.createElement("div");

  avatar.className =
    "message-avatar";

  avatar.textContent =
    type === "ai" ? "H" : "YOU";

  const body =
    document.createElement("div");

  body.className =
    "message-body";

  const name =
    document.createElement("div");

  name.className =
    "message-name";

  name.textContent =
    type === "ai"
      ? "HEMTON.AI"
      : "You";

  const content =
    document.createElement("div");

  content.className =
    "message-content";

  content.textContent = text;

  body.appendChild(name);
  body.appendChild(content);

  if(type === "ai"){

    const actions =
      document.createElement("div");

    actions.className =
      "message-actions";

    const copy =
      document.createElement("button");

    copy.className =
      "action-button";

    copy.textContent =
      "Copy";

    copy.onclick =
      function(){

        navigator.clipboard
          .writeText(text)
          .then(function(){

            copy.textContent =
              "Copied ✓";

            setTimeout(
              ()=>copy.textContent="Copy",
              1200
            );

          })
          .catch(
            ()=>{}
          );

      };

    actions.appendChild(copy);

    body.appendChild(actions);

  }

  message.appendChild(avatar);
  message.appendChild(body);

  chatInner.appendChild(message);

  scrollToBottom();

}

/* TYPING */

function showTyping(){

  const message =
    document.createElement("div");

  message.id="typingMessage";

  message.className =
    "message ai";

  message.innerHTML = `
    <div class="message-avatar">H</div>
    <div class="message-body">
      <div class="message-name">HEMTON.AI</div>
      <div class="typing">
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
      </div>
    </div>
  `;

  chatInner.appendChild(message);

  scrollToBottom();

}

function removeTyping(){

  const typing =
    document.getElementById(
      "typingMessage"
    );

  if(typing)
    typing.remove();

}

/* DEMO RESPONSE */

function generateDemoReply(text){

  const lower =
    text.toLowerCase();

  if(
    lower.includes("hello") ||
    lower.includes("hi") ||
    lower.includes("hey")
  ){

    return (
      "Hello! 👋\n\n" +
      "I'm HEMTON.AI. " +
      "It's great to meet you.\n\n" +
      "I'm currently running in demo mode. " +
      "The interface is ready, and the next step is connecting me to a real AI model."
    );

  }

  if(
    lower.includes("code") ||
    lower.includes("program")
  ){

    return (
      "Absolutely! 💻\n\n" +
      "I can help you build, explain, " +
      "debug, and improve code.\n\n" +
      "HEMTON.AI is currently in demo mode, " +
      "so the real AI engine still needs to be connected."
    );

  }

  if(
    lower.includes("who are you") ||
    lower.includes("what are you")
  ){

    return (
      "I'm HEMTON.AI 🤖\n\n" +
      "I'm designed to be your personal AI assistant for questions, ideas, coding, writing, planning, and more.\n\n" +
      "Right now I'm running the website's demo engine."
    );

  }

  return (
    "I received your message:\n\n" +
    "“" + text + "”\n\n" +
    "HEMTON.AI is currently in demo mode. " +
    "Once a secure AI backend is connected, " +
    "I'll be able to generate real AI answers to your questions."
  );

}

/* HISTORY */

function addHistoryItem(text){

  const item =
    document.createElement("div");

  item.className =
    "history-item active";

  item.textContent =
    text.length > 28
      ? text.substring(0,28)+"..."
      : text;

  historyList.prepend(item);

}

/* NEW CHAT */

function newChat(){

  document
    .querySelectorAll(".message")
    .forEach(
      el=>el.remove()
    );

  welcome.style.display="flex";

  conversationStarted=false;

  input.value="";

  input.style.height="auto";

  sendButton.disabled=true;

  toggleSidebar(false);

}

/* VOICE */

function startVoice(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){

    alert(
      "Voice input isn't supported by this browser."
    );

    return;

  }

  const recognition =
    new SpeechRecognition();

  recognition.lang =
    "en-US";

  recognition.interimResults =
    false;

  recognition.maxAlternatives =
    1;

  recognition.start();

  recognition.onresult =
    function(event){

      input.value =
        event.results[0][0].transcript;

      input.dispatchEvent(
        new Event("input")
      );

      input.focus();

    };

  recognition.onerror =
    function(){

      console.log(
        "Voice recognition error"
      );

    };

}

/* SIDEBAR */

function toggleSidebar(force){

  if(force === false){

    sidebar.classList.remove("open");
    overlay.classList.remove("open");
    return;

  }

  sidebar.classList.toggle("open");
  overlay.classList.toggle("open");

}

function scrollToBottom(){

  setTimeout(function(){

    chat.scrollTop =
      chat.scrollHeight;

  },50);

}
